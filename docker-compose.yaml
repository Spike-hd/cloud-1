# ----  Les différents services -----

services:
  mariadb:
    image: mariadb:lts
    container_name: mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD:?missing root password for mariadb}
      MARIADB_DATABASE: ${WP_DB_NAME:?missing mariadb database}
      MARIADB_USER: ${WP_DB_USER:?missing mariadb user}
      MARIADB_PASSWORD: ${WP_DB_PASSWORD:?missing mariadb password}
    volumes:
      - mariadb_volume:/var/lib/mysql
    networks:
      - cloud-1

  wordpress:
    image: wordpress:7.1.4-php8.2-fpm-alpine 
    container_name: wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_USER: ${WP_DB_USER:?missing db user for wordpress}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:?missing db password for wordpress}
      WORDPRESS_DB_NAME: ${WP_DB_NAME:?missing db name for wordpress}
    volumes:
      - wordpress_volume:/var/www/html
    depends_on:
      - mariadb
    networks:
      - cloud-1

  wpcli:
    image: wordpress:cli-php8.2
    profiles: ["tools"]
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_USER: ${WP_DB_USER:?missing db user for wordpress}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:?missing db password for wordpress}
      WORDPRESS_DB_NAME: ${WP_DB_NAME:?missing db name for wordpress}
    volumes:
      - wordpress_volume:/var/www/html
    depends_on:
      - wordpress
    networks:
      - cloud-1

  phpmyadmin:
    image: phpmyadmin:5.2.3-fpm-alpine
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    volumes:
      - phpmyadmin_files:/var/www/html
    depends_on:
      - mariadb
    networks:
      - cloud-1

  nginx:
    build: ./nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - wordpress
      - phpmyadmin
      # NGINX a besoin d'accéder aux fichiers WordPress et phpMyAdmin (pour servir les fichiers statiques : images, CSS, JS)
    volumes:
      - wordpress_volume:/var/www/html/wordpress:ro
      - phpmyadmin_files:/var/www/html/phpmyadmin 

    networks:
      - cloud-1

# ----  Les volumes (named volumes) -----
volumes:
  mariadb_volume:
  wordpress_volume:
  phpmyadmin_files:

# ----  Le réseau -----
networks:
  cloud-1: