# ==============================================
# Configuration NGINX pour le projet Inception
# NGINX sert de reverse proxy HTTPS vers WordPress
# ==============================================

server {
    listen 80;
    listen [::]:80;
    server_name spike.42.fr localhost; # Les hosts que ce serveur doit gérer (le nom de domaine)
    return 301 https://$host$request_uri; # Redirige tout le trafic HTTP vers HTTPS (code 301 = redirection permanente)
}

server {
    # Écoute sur le port 443 (HTTPS) avec SSL activé
    listen 443 ssl;
    listen [::]:443 ssl;
    # Les hosts que ce serveur doit gérer (le nom de domaine)
    server_name spike.42.fr localhost;
    # Chemins vers le certificat SSL (généré dans le Dockerfile)
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    # Protocoles SSL autorisés
    ssl_protocols TLSv1.2 TLSv1.3;

    # ==============================================================================
    # ROUTE A :  (racine du site '/' ou n'importe quelle route gérée par WordPress)
    # ==============================================================================
    location / {
        root /var/www/html/wordpress; # Le volume monté depuis le conteneur "wordpress" contient les fichiers de WordPress
        index index.php index.html; # Fichier par défaut à servir si la requête est pour un dossier
        try_files $uri $uri/ /index.php$is_args$args; # Tente de servir le fichier demandé, sinon redirige vers index.php (WordPress gère les routes via index.php)
    }


    # ======================================================
    # ROUTE B : WORDPRESS PHP-FPM (pour les fichiers .php)
    # ======================================================
    location ~ ^/(?!(phpmyadmin)).*\.php$ {
        # Racine côté NGINX
        root /var/www/html/wordpress;
        
        # Sépare le chemin du fichier PHP des arguments
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Envoie la requête au conteneur "wordpress" sur le port 9000
        # "wordpress" = le nom du service dans docker-compose.yml
        # Docker résout ce nom automatiquement grâce au réseau "cloud-1"
        fastcgi_pass wordpress:9000;

        # Fichier PHP par défaut
        fastcgi_index index.php;

        # Inclut les paramètres FastCGI standards
        include fastcgi_params;

        # Indique à PHP quel fichier exécuter
        # ATTENTION: Le PHP-FPM tourne dans /var/www/html dans son conteneur
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # ======================================================
    # ROUTE C : PHPMYADMIN (pour les fichiers .php)
    # ======================================================
    location ^~ /phpmyadmin/ {
        # La racine pour les éléments statiques.
        root /var/www/html;
        index index.php index.html;
        try_files $uri $uri/ /phpmyadmin/index.php$is_args$args;

        # On intercepte les requêtes PHP sous /phpmyadmin
        location ~ ^/phpmyadmin(/.+\.php)$ {
            fastcgi_pass phpmyadmin:9000;

            # Fichier PHP par défaut
            fastcgi_index index.php;

            # Inclut les paramètres FastCGI standards
            include fastcgi_params;

            # Le $1 cible la portion de l'URL APRES /phpmyadmin, 
            # car le conteneur phpmyadmin place ses fichiers à la racine /var/www/html
            fastcgi_param SCRIPT_FILENAME /var/www/html$1;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }
}

