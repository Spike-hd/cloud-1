---
- name: Provisionner la VM cloud-1 avec Docker et Docker Compose
  hosts: cloud
  become: yes # Exécute les commandes en tant que root

# -----------------------------------------#
# Installation de Docker et Docker Compose #
# -----------------------------------------#
  tasks:
    - name: Mettre à jour le cache et installer Docker
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - docker.io
          - docker-compose
        update_cache: yes

    - name: S'assurer que Docker est bien démarré
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    - name: Ajouter l'utilisateur {{ ansible_user }} au groupe docker pour utiliser Docker sans sudo
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    
# ---------------------------------------------#
# Création des dossiers de données pour Docker #
# ---------------------------------------------#

# Volumes
    - name: Créer les dossiers pour les volumes Docker
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/cloud-1/data/{{ item }}"
        state: directory
        mode: '0777' # Permission peut etre trop permissive pour la production à corriger
      loop:
        - mariadb
        - wordpress
        - phpmyadmin


# Dossier du projet
    - name: Créer le dossier du projet
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/cloud-1"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'


    # -----------------------------------------#
    # Copier les dossier et fichiers du projet #
    # -----------------------------------------#
    - name: Copier les fichiers du projet
      ansible.builtin.copy:
        src: "../{{ item }}"
        dest: "/home/{{ ansible_user }}/cloud-1/"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      loop:
        - docker-compose.yaml
        - .env
        - nginx

    # ---------------------------------------#
    # Démarrer le projet avec Docker Compose #
    # ---------------------------------------#

    - name: Démarrer le projet avec Docker Compose
      ansible.builtin.command: docker-compose -f docker-compose.yaml up -d --build
      args:
        chdir: "/home/{{ ansible_user }}/cloud-1"
