# Install Docker and Docker Compose
---
- name: Install Docker & Docker Compose
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - docker-buildx
      - docker.io
      - docker-compose
    state: present
    update_cache: true

- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add user to docker group to use Docker without sudo
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
